name: testbed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Makes this a reusable workflow: another repo adds a job like
  #   dogfood:
  #     uses: CorvidLabs/magpie/.github/workflows/test.yml@main
  #     with: { specs-dir: .magpie-specs, macos-targets: macos, linux-targets: none }
  # and points specs-dir at its OWN .3md specs (see README's "Using this in
  # another repo"). Defaults below match magpie's own self-test, so this
  # trigger changes nothing when the workflow runs on pushes/PRs here.
  #
  # The literal string "none" (not empty string) is what skips a job: GitHub
  # Actions coerces a null `inputs.*` (the case on every non-workflow_call
  # trigger — schema defaults only apply inside an actual workflow_call
  # invocation) to '' for comparison, so `inputs.x != ''` is false and would
  # wrongly skip both of magpie's own jobs on every plain push. Confirmed
  # this the hard way: it happened on the first push that tried `!= ''`.
  workflow_call:
    inputs:
      specs-dir:
        type: string
        default: specs
      linux-targets:
        type: string
        default: cli
      macos-targets:
        type: string
        default: 'api,web,macos,ios'

jobs:
  linux:
    name: CLI (ubuntu)
    if: ${{ inputs.linux-targets != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Always fetched, even when this repo IS magpie (a few redundant
      # seconds for magpie's own runs beats a conditional-checkout-path
      # expression that can't be exercised until a caller repo actually
      # invokes this workflow.
      - name: Checkout magpie engine
        uses: actions/checkout@v4
        with:
          repository: CorvidLabs/magpie
          path: .magpie-engine

      - uses: oven-sh/setup-bun@v2

      # fledge-plugin-http is a Swift package that calls Darwin-only
      # Foundation/CoreFoundation APIs (HTTPURLResponse.statusCode,
      # CFGetTypeID, ...) and does not build under swift-corelibs-foundation
      # on Linux — a real upstream portability bug, not a flag we can pass
      # around. cli only needs fledge + rune (both plain Rust, build fine
      # here), so the api target runs on the macos job instead, where that
      # plugin is on native Darwin Foundation.
      - name: Install fledge + plugins
        run: |
          cargo install fledge
          fledge plugins install --non-interactive --yes CorvidLabs/rune

      - name: Install magpie engine deps
        working-directory: .magpie-engine
        run: bun install

      - name: Run CLI target
        timeout-minutes: 5
        run: bun .magpie-engine/runner/run.ts --specs-dir=${{ inputs.specs-dir || 'specs' }} --out-dir=artifacts --targets=${{ inputs.linux-targets || 'cli' }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/

  macos:
    name: API + Web + macOS + iOS (macos)
    if: ${{ inputs.macos-targets != 'none' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout magpie engine
        uses: actions/checkout@v4
        with:
          repository: CorvidLabs/magpie
          path: .magpie-engine

      - uses: oven-sh/setup-bun@v2

      - name: Install fledge + plugins
        run: |
          brew install corvidlabs/tap/fledge
          fledge plugins install --non-interactive --yes CorvidLabs/fledge-plugin-http

      - name: Install magpie engine deps
        working-directory: .magpie-engine
        run: bun install

      # Bounded on purpose: the first run of this job hung indefinitely here
      # with no other signal (likely a macOS Automation/Apple-Events consent
      # dialog for AppleScript controlling Safari or Calculator, with no one
      # present to click "Allow" — distinct from the Screen Recording
      # permission issue). A hard timeout turns a silent CI-minutes leak into
      # a clear failure, and "Upload artifacts" below still runs on timeout
      # so partial per-step JSON/screenshots survive for diagnosis.
      - name: Run API + web + macOS + iOS targets
        timeout-minutes: 8
        run: bun .magpie-engine/runner/run.ts --specs-dir=${{ inputs.specs-dir || 'specs' }} --out-dir=artifacts --targets=${{ inputs.macos-targets || 'api,web,macos,ios' }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/

  # Android is guidance-only in specs/android.3md today — no tool= bindings.
  # reactivecircus/android-emulator-runner (works on macos-latest, has KVM)
  # is the natural way to turn it into a real adapter; left out of this
  # workflow until that spec is written and proven, same discipline as the
  # other five targets.
