name: testbed

# Matches fledge's own ci.yml convention: cancel a superseded run on a PR
# branch (fast feedback while iterating), but let every push to main run
# to completion (so main always has a full, bisectable CI verdict per
# commit). This session's own rapid-fire pushes directly to main are
# exactly the case this doesn't dedupe — that's the tradeoff, not a bug.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Makes this a reusable workflow: another repo adds a job like
  #   dogfood:
  #     uses: CorvidLabs/magpie/.github/workflows/test.yml@main
  #     with: { specs-dir: .magpie-specs, macos-targets: macos, linux-targets: none }
  # and points specs-dir at its OWN .3md specs (see README's "Using this in
  # another repo"). Defaults below match magpie's own self-test, so this
  # trigger changes nothing when the workflow runs on pushes/PRs here.
  #
  # The literal string "none" (not empty string) is what skips a job: GitHub
  # Actions coerces a null `inputs.*` (the case on every non-workflow_call
  # trigger — schema defaults only apply inside an actual workflow_call
  # invocation) to '' for comparison, so `inputs.x != ''` is false and would
  # wrongly skip both of magpie's own jobs on every plain push. Confirmed
  # this the hard way: it happened on the first push that tried `!= ''`.
  workflow_call:
    inputs:
      specs-dir:
        type: string
        default: specs
      linux-targets:
        type: string
        default: cli
      macos-targets:
        type: string
        default: 'api,web,macos,ios'

# CodeQL flagged all three jobs for this (actions/checkout +
# actions/upload-artifact are the only actions any of them use — neither
# needs more than read access to repo contents; no PR comments, no
# packages, no pages, nothing else). Matches fledge's own ci.yml, which
# has the identical `contents: read` at the same top level.
permissions:
  contents: read

jobs:
  linux:
    name: CLI (ubuntu)
    if: ${{ inputs.linux-targets != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Always fetched, even when this repo IS magpie (a few redundant
      # seconds for magpie's own runs beats a conditional-checkout-path
      # expression that can't be exercised until a caller repo actually
      # invokes this workflow.
      - name: Checkout magpie engine
        uses: actions/checkout@v4
        with:
          repository: CorvidLabs/magpie
          path: .magpie-engine

      - uses: oven-sh/setup-bun@v2

      # fledge-plugin-http is a Swift package that calls Darwin-only
      # Foundation/CoreFoundation APIs (HTTPURLResponse.statusCode,
      # CFGetTypeID, ...) and does not build under swift-corelibs-foundation
      # on Linux — a real upstream portability bug, not a flag we can pass
      # around. cli only needs fledge + rune (both plain Rust, build fine
      # here), so the api target runs on the macos job instead, where that
      # plugin is on native Darwin Foundation.
      #
      # fledge itself has no action.yml (checked; spec-sync does, fledge
      # doesn't). install.sh (a prebuilt release-binary download, not a
      # from-source build — `cargo install fledge` compiled ~355
      # dependencies including wasmtime and was the actual cause of this
      # job's original 10-minute runs) always resolves "latest" via an
      # unauthenticated GitHub API call with no way to pin a version —
      # confirmed hitting that rate limit (60 req/hr/IP) after this
      # session's own run volume: "Error: could not determine latest
      # version" on two consecutive runs. Downloading a pinned release
      # binary directly sidesteps the lookup entirely; bump FLEDGE_VERSION
      # occasionally rather than always tracking latest. rune has neither
      # an action.yml nor an install.sh (it's a Ruby gem);
      # `fledge plugins install` is still the only documented path for it.
      - name: Install fledge + plugins
        env:
          FLEDGE_VERSION: v1.7.2
        run: |
          curl -fsSL "https://github.com/CorvidLabs/fledge/releases/download/${FLEDGE_VERSION}/fledge-linux-x86_64" -o /usr/local/bin/fledge
          chmod +x /usr/local/bin/fledge
          fledge plugins install --non-interactive --yes CorvidLabs/rune

      - name: Install magpie engine deps
        working-directory: .magpie-engine
        run: bun install

      - name: Run CLI target
        timeout-minutes: 5
        run: bun .magpie-engine/runner/run.ts --specs-dir=${{ inputs.specs-dir || 'specs' }} --out-dir=artifacts --targets=${{ inputs.linux-targets || 'cli' }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/

  macos:
    name: API + Web + macOS + iOS (macos)
    if: ${{ inputs.macos-targets != 'none' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout magpie engine
        uses: actions/checkout@v4
        with:
          repository: CorvidLabs/magpie
          path: .magpie-engine

      - uses: oven-sh/setup-bun@v2

      # Same pinned-download reasoning as the linux job's Install step —
      # see its comment. Also avoids brew's own overhead and the unrelated
      # "untrusted tap" warning noise a prior run showed. fledge-plugin-http
      # (Swift) has neither an action.yml nor an install.sh;
      # `fledge plugins install` is still the only documented path for it.
      - name: Install fledge + plugins
        env:
          FLEDGE_VERSION: v1.7.2
        run: |
          curl -fsSL "https://github.com/CorvidLabs/fledge/releases/download/${FLEDGE_VERSION}/fledge-macos-aarch64" -o /usr/local/bin/fledge
          chmod +x /usr/local/bin/fledge
          fledge plugins install --non-interactive --yes CorvidLabs/fledge-plugin-http

      - name: Install magpie engine deps
        working-directory: .magpie-engine
        run: bun install

      # Bounded on purpose: the first run of this job hung indefinitely here
      # with no other signal (likely a macOS Automation/Apple-Events consent
      # dialog for AppleScript controlling Safari or Calculator, with no one
      # present to click "Allow" — distinct from the Screen Recording
      # permission issue). A hard timeout turns a silent CI-minutes leak into
      # a clear failure, and "Upload artifacts" below still runs on timeout
      # so partial per-step JSON/screenshots survive for diagnosis.
      - name: Run API + web + macOS + iOS targets
        timeout-minutes: 8
        run: bun .magpie-engine/runner/run.ts --specs-dir=${{ inputs.specs-dir || 'specs' }} --out-dir=artifacts --targets=${{ inputs.macos-targets || 'api,web,macos,ios' }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/

  android:
    name: Android (emulator)
    # Magpie's own specs/android.3md only — not part of the workflow_call
    # generalization. A caller repo's checkout has no specs/android.3md
    # (or wouldn't want this run at all), so this only runs when the
    # workflow's own repo is magpie, never for MacNTop/fledge/a sandbox
    # invoking it via workflow_call. github.repository reflects the
    # CALLING repo inside a reusable-workflow job, which is exactly the
    # distinction needed here — unlike inputs.*, this doesn't hit the
    # null-coercion trap documented above.
    if: ${{ github.repository == 'CorvidLabs/magpie' }}
    # NOT macos-latest — that was the first attempt and it fails every
    # time: "HVF error: HV_UNSUPPORTED" / "failed to initialize HVF".
    # GitHub's hosted macOS runners are themselves VMs and don't support
    # nested virtualization for Hypervisor.framework, so hardware-
    # accelerated Android emulation is fundamentally unavailable there,
    # not a config problem. ubuntu-latest supports KVM acceleration for
    # Android emulators — the standard, documented pattern for this
    # action — hence the "Enable KVM" step below and arch: x86_64 to
    # match the runner's actual hardware.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # Same pinned-download reasoning as the other two jobs' Install
      # steps — see the linux job's comment.
      - name: Install fledge
        env:
          FLEDGE_VERSION: v1.7.2
        run: |
          curl -fsSL "https://github.com/CorvidLabs/fledge/releases/download/${FLEDGE_VERSION}/fledge-linux-x86_64" -o /usr/local/bin/fledge
          chmod +x /usr/local/bin/fledge

      - name: Install deps
        run: bun install

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # reactivecircus/android-emulator-runner owns the emulator's whole
      # boot -> script -> shutdown lifecycle inside this one step (unlike
      # simctl, there's no persistent OS-level emulator to boot in an
      # earlier step and reuse in a later one).
      - name: Run Android target (emulator boots and shuts down within this step)
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader-indirect -noaudio -no-boot-anim
          script: bun runner/run.ts --targets=android

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: artifacts/
