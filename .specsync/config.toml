# spec-sync v4 configuration
# Docs: https://github.com/CorvidLabs/spec-sync

# Back to spec-sync's own natural default ("specs", not "module-specs").
# The workaround this comment used to explain — magpie's own agent3md test
# specs already claimed "specs/*.3md" — is gone: those moved to
# .magpie/specs/ instead, specifically so a testbed meant to be dropped
# into other real projects doesn't force them to rename whatever they
# already keep in a directory this common. See runner/run.ts's own
# comment on --specs-dir's default for the full reasoning.
specs_dir = "specs"
# magpie's real application source — the engine itself, not the specs it
# executes.
source_dirs = ["runner"]
exclude_dirs = []
exclude_patterns = []
required_sections = ["Purpose", "Public API", "Invariants", "Behavioral Examples", "Error Cases", "Dependencies", "Change Log"]
enforcement = "strict"

[lifecycle]
track_history = false
